<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kit-Smith Menu System</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#111827;color:#f3f4f6;font-family:sans-serif;margin:0}nav{background:#1f2937;padding:16px 24px;border-bottom:1px solid #374151}nav h1{display:inline;font-size:20px;color:#34d399;margin-right:24px}nav a{color:#d1d5db;text-decoration:none;font-size:14px}main{max-width:900px;margin:0 auto;padding:24px}h2{color:#6ee7b7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}.grid a{display:block;background:#1f2937;border:1px solid #374151;border-radius:12px;padding:32px;color:inherit;text-decoration:none}.grid a:hover{border-color:#10b981}</style></head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">
<nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex items-center gap-6">
<h1 class="text-xl font-bold text-emerald-400 tracking-wide">📦 KIT-SMITH MENU ENGINEERING SYSTEM</h1>
<a href="/" class="text-gray-300 hover:text-white text-sm">Main Menu</a></nav>
<main class="max-w-4xl mx-auto p-6">
<h2 class="text-2xl font-semibold text-emerald-300 mb-2">{{ title }}</h2>
<p class="text-gray-400 mb-4">{{ blurb }}</p>
<p class="bg-gray-800 border border-gray-700 rounded-xl p-6">🚧 Coming soon. This module has not been built yet.</p>
<a href="/" class="text-emerald-400 text-sm mt-4 inline-block">← Back to Main Menu</a>
</main></body></html>
